name: Blog CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test Markdown image defaults
        run: node --test scripts/rehypeLazyImages.test.mjs scripts/imageCdn.test.mjs scripts/tableOfContents.test.mjs scripts/copyCode.test.mjs scripts/searchArticles.test.mjs scripts/technicalPosts.test.mjs scripts/counterStore.test.mjs scripts/viewProtection.test.mjs scripts/validate-internal-links.test.mjs scripts/a11y-smoke.test.mjs scripts/aboutCredentials.test.mjs scripts/copilotBadge.test.mjs scripts/lighthouseCI.test.mjs scripts/aboutAvatarPerformance.test.mjs scripts/fontsPerformance.test.mjs scripts/i18n.test.mjs scripts/i18nContent.test.mjs
      - name: Build using Netlify image delivery settings
        run: NETLIFY=true npm run build
      - name: Verify RSS and sitemap are generated
        run: |
          test -f dist/rss.xml
          test -f dist/es/rss.xml
          test -f dist/sitemap-index.xml
          test -f dist/search/index.html
          if grep -q 'https://luisiitodev.com/search/' dist/sitemap-*.xml; then
            echo 'Internal search should not be in the sitemap'
            exit 1
          fi
          grep -q 'name="robots" content="noindex, follow"' dist/search/index.html
          grep -R -q '/.netlify/images' dist
      - name: Validate generated links and images
        run: node scripts/validate-internal-links.mjs
      - name: Check generated HTML accessibility baseline
        run: node scripts/a11y-smoke.mjs
      - name: Verify localized Spanish article metadata
        run: |
          grep -R -q 'lang="es"' dist
          grep -R -q 'property="og:locale" content="es_CR"' dist
          grep -R -q '"inLanguage":"es"' dist

